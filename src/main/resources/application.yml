spring:
  application:
    name: UberReviewService

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true

flyway:
  url: jdbc:mysql://localhost:3306/Uber_Db_Local
  user: root
  password: Shivam@123
  schemas: Uber_Db_Local